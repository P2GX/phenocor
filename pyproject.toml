# pyproject.toml

[build-system]
requires = ["setuptools>=65.6.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phenocor"
requires-python = ">=3.10"
description = "A Python package for correlation analysis of HPO annotations in GA4GH phenopacket cohorts"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    {name = "Jing Chen", email="jing.chen@bih-charite.de"},
]
maintainers =[{name = "Peter Robinson", email="peter.robinson@bih-charite.de"},
             {name = "Daniel Danis", email="daniel.danis@bih-charite.de"},]
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
keywords = [
    "Global Alliance for Genomics and Health",
    "GA4GH Phenopacket Schema",
    "Human Phenotype Ontology",
    "GA4GH",
    "HPO"]

# version in __init__
dynamic = ["version"]

dependencies = [
    "hpo-toolkit>=0.5.0,<0.6",
    "phenopackets>=2.0.2,<3.0",
    "numpy>=1.26.4,<3.0",
    "pandas>=2.2.3,<3.0",
    "plotly>=6.1.1",
    "kaleido>=1.0.0",
    "scipy>=1.15.1,<2.0",          
    "joblib>=1.4.2,<2.0",        
    "tqdm>=4.67.1,<5.0",          
    "statsmodels>=0.14.4,<1.0",
    "openpyxl>=3.1.0,<4.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0.0,<8.0.0"]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "nbsphinx>=0.8.10",
    "ipython",
    "nbconvert",
    "phenopacket-store-toolkit",
]



[project.urls]
homepage = "https://github.com/P2GX/phenocor"
repository = "https://github.com/P2GX/phenocor.git"
documentation = "https://P2GX.github.io/phenocor/"
bugtracker = "https://github.com/P2GX/phenocor/issues"

[tool.setuptools]
package-dir = { "" = "src" }
zip-safe = false

[tool.setuptools.dynamic]
version = { attr = "phenocor.__version__" }



[tool.yapf]
blank_line_before_nested_class_or_def = true
column_limit = 88

[tool.pylint]
max-line-length = 88
disable = [
    "C0103", # (invalid-name)
    "C0114", # (missing-module-docstring)
    "C0115", # (missing-class-docstring)
    "C0116", # (missing-function-docstring)
    "R0903", # (too-few-public-methods)
    "R0913", # (too-many-arguments)
    "W0105", # (pointless-string-statement)
]
